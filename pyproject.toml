[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "electrolyte-memory-surrogates"
version = "0.1.0"
description = "Testing whether small current-prediction errors conceal incorrect algebraic relaxation"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {file = "LICENSE"}
authors = [{name = "Haggai Bonneau"}]
dependencies = [
    "numpy==1.26.4",
    "scipy==1.16.0",
    "matplotlib==3.10.0",
    "torch==2.2.2",
]

[tool.setuptools.packages.find]
where = ["src"]
